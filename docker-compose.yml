services:
  app:
    build: ./docker/app
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sanad}
      MYSQL_USER: ${DB_USERNAME:-sanad}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sanad}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-sanad-root}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-sanad}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-sanad-secret}
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  mysql-data:
  redis-data:
  minio-data:
