services:
  app:
    build: ./docker/app
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
      - redis

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sanad}
      POSTGRES_USER: ${DB_USERNAME:-sanad}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sanad}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-sanad}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-sanad-secret}
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  postgres-data:
  redis-data:
  minio-data:
