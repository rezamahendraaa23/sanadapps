name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sanad_test
          POSTGRES_USER: sanad
          POSTGRES_PASSWORD: sanad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: sanad_test
      DB_USERNAME: sanad
      DB_PASSWORD: sanad
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, pdo_pgsql, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: npm run build

      - run: cp .env.example .env && php artisan key:generate

      - run: vendor/bin/pint --test
      - run: psql -h 127.0.0.1 -U sanad -d sanad_test -c 'CREATE DATABASE sanad_concurrency'
        env:
          PGPASSWORD: sanad
      - run: vendor/bin/pest

      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_DB: sanad_test
